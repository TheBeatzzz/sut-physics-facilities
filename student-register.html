<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create a student study progress account for the Physics Program at Suranaree University of Technology." />
    <meta name="robots" content="noindex, nofollow" />
    <title>Create Student Account · SUT Physics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="student-register.js" defer></script>
  </head>
  <body class="student-portal student-register">
    <section id="student-register" class="auth-gate" aria-labelledby="student-register-title">
      <div class="auth-card">
        <p class="eyebrow">Student portal</p>
        <h1 id="student-register-title">Create your Physics study account.</h1>
        <p>Use your SUT email and enter the trimester and year when you began your study. Faculty verification is required before your record becomes official.</p>
        <form id="student-signup-form" class="auth-form">
          <label>Full name<input name="name" autocomplete="name" required /></label>
          <label>Student ID<input name="studentCode" autocomplete="off" /></label>
          <label>Start trimester<select name="startTerm" required><option value="">Choose term</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select></label>
          <label>Start year<input name="startYear" type="number" min="1950" max="2100" placeholder="YYYY" required /></label>
          <label>SUT email<input name="email" type="email" autocomplete="email" placeholder="name@g.sut.ac.th" required /></label>
          <label>Password<input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
          <button class="button button-primary" type="submit">Create account</button>
        </form>
        <div class="auth-actions">
          <a class="button button-secondary" href="student-portal.html">Back to sign in</a>
        </div>
        <p class="auth-help" id="student-auth-message" role="status" aria-live="polite">Use your SUT or g.sut.ac.th email address.</p>
      </div>
    </section>
  </body>
</html>
